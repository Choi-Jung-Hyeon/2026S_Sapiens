<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PackCheck - 여행 준비물 체크리스트</title>
<meta name="description" content="여행 조건을 고르면 준비물 체크리스트를 만들어 줍니다.">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">

<!-- ===== Google Analytics (GA4) 시작 ===== -->
<!-- 교체 위치: 아래 두 곳의 G-XXXXXXXXXX 를 실제 측정 ID로 바꾸세요. (총 2군데) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>
<!-- ===== Google Analytics (GA4) 끝 ===== -->

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="head">
    <div class="logo">PackCheck</div>
    <button type="button" id="resetBtn" class="reset-btn hidden">처음부터 다시</button>
  </div>

  <!-- STEP 1 : 여행 정보 입력 -->
  <section id="step1">
    <p class="lead">여행 조건을 고르면 준비물 체크리스트를 만들어 드립니다.</p>

    <div class="field">
      <div class="field-label">목적지</div>
      <div class="opts" id="f-destination"></div>
    </div>

    <div class="field hidden" id="field-country">
      <div class="field-label">국가</div>
      <div class="opts" id="f-country"></div>
    </div>

    <div class="field">
      <div class="field-label">출발 월</div>
      <select id="f-month"></select>
    </div>

    <div class="field">
      <div class="field-label">기간</div>
      <div class="opts" id="f-nights"></div>
    </div>

    <div class="field">
      <div class="field-label">여행 성격</div>
      <div class="opts" id="f-purpose"></div>
    </div>

    <div class="field">
      <div class="field-label">인원</div>
      <div class="opts" id="f-headcount"></div>
    </div>

    <button type="button" id="makeBtn" class="primary">준비물 리스트 만들기</button>
  </section>

  <!-- STEP 2 : 체크리스트 -->
  <section id="step2" class="hidden">
    <p class="lead" id="tripSummary"></p>

    <div class="prog">
      <div class="prog-track"><i class="prog-fill" id="progFill"></i></div>
      <div class="prog-text" id="progText"></div>
    </div>

    <h2 class="sec-title">필수 준비물</h2>
    <div id="essentials"></div>

    <h2 class="sec-title">이런 것도 필요하지 않으세요?</h2>
    <p class="sec-desc">입력한 조건에 맞춰 골라 봤습니다.</p>
    <div id="suggestions"></div>
  </section>
</div>

<div class="bottom hidden" id="bottomBar">
  <div class="bottom-inner">
    <button type="button" id="shareBtn" class="primary">체크리스트 공유하기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 준비물 규칙 테이블. 준비물을 바꾸려면 rules.js 만 고치면 됩니다. -->
<script src="rules.js"></script>

<script>
(function () {
  'use strict';

  /* ============================================================
     선택지 정의 (STEP 1 버튼과 공유 링크 코드에 함께 쓰입니다)
     ============================================================ */
  // rules.js 가 함께 있어야 동작합니다. (index.html / rules.js / style.css 세 파일을 같은 폴더에 두세요)
  if (typeof RULES === 'undefined') {
    document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif">rules.js 파일을 찾을 수 없습니다. '
      + 'index.html, rules.js, style.css 를 같은 폴더에 두고 다시 열어 주세요.</div>';
    return;
  }

  var CHOICES = {
    destination: [
      { code: 'domestic', label: '국내' },
      { code: 'overseas', label: '해외' }
    ],
    country: [
      { code: 'jp',  label: '일본' },
      { code: 'cn',  label: '중국' },
      { code: 'sea', label: '동남아' },
      { code: 'eu',  label: '유럽' },
      { code: 'us',  label: '미주' },
      { code: 'oc',  label: '오세아니아' },
      { code: 'etc', label: '기타' }
    ],
    // code 는 박수(숫자)입니다. 공유 링크의 n 값으로도 그대로 쓰입니다.
    nights: [
      { code: 0, label: '당일' },
      { code: 1, label: '1박2일' },
      { code: 2, label: '2~3박' },
      { code: 4, label: '4~6박' },
      { code: 7, label: '7박 이상' }
    ],
    purpose: [
      { code: 'tour',   label: '관광' },
      { code: 'relax',  label: '휴양' },
      { code: 'active', label: '액티비티' },
      { code: 'biz',    label: '출장' }
    ],
    headcount: [
      { code: 1, label: '1명' },
      { code: 2, label: '2명' },
      { code: 3, label: '3명 이상' }
    ]
  };


  /* ============================================================
     GA 이벤트 전송 헬퍼
     gtag 가 없거나 광고 차단기에 막혀도 화면이 죽지 않도록 감쌉니다.
     모든 이벤트는 반드시 이 함수로만 보냅니다.
     ============================================================ */
  function track(name, params) {
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('event', name, params || {});
      }
    } catch (e) {
      // 측정 실패가 서비스 동작을 막지 않도록 무시합니다.
    }
  }

  // 항목별로 같은 이벤트를 한 번만 보냅니다.
  function trackOnce(name, key, params) {
    var mark = name + '|' + key;
    if (state.sent[mark]) { return; }
    state.sent[mark] = true;
    track(name, params);
    save();
  }

  /* ============================================================
     상태
     ============================================================ */
  var STORAGE_KEY = 'packcheck_v1';
  var state = {
    step: 1,
    trip: null,        // { destination, country, month, nights, purpose, headcount }
    items: [],         // 필수 준비물 [{ id, name, category, qty, checked }]
    suggestions: [],   // 추천 카드 [{ id, name, category, reason }]
    sent: {}           // 이벤트 중복 전송 방지
  };

  // STEP 1 에서 고르는 중인 값
  var draft = {
    destination: null,
    country: null,
    month: new Date().getMonth() + 1,
    nights: null,
    purpose: null,
    headcount: null
  };

  /* ============================================================
     규칙 평가
     ============================================================ */
  function resolveName(rule, trip) {
    return typeof rule.name === 'function' ? rule.name(trip) : rule.name;
  }

  function calcQty(qty, trip) {
    if (qty === null || qty === undefined) { return null; }
    if (typeof qty === 'number') { return qty; }
    var formula = QTY_FORMULA[qty];
    return formula ? formula(trip.nights) : null;
  }

  function buildList(trip) {
    var items = [];
    var suggestions = [];
    for (var i = 0; i < RULES.length; i++) {
      var rule = RULES[i];
      if (rule.when && !rule.when(trip)) { continue; }
      var entry = {
        id: rule.id,
        name: resolveName(rule, trip),
        category: rule.category,
        qty: calcQty(rule.qty, trip)
      };
      if (rule.type === 'auto') {
        entry.checked = false;
        items.push(entry);
      } else {
        entry.reason = rule.reason;
        suggestions.push(entry);
      }
    }
    return { items: items, suggestions: suggestions };
  }

  /* ============================================================
     라벨 도우미
     ============================================================ */
  function labelOf(kind, code) {
    var list = CHOICES[kind];
    for (var i = 0; i < list.length; i++) {
      if (list[i].code === code) { return list[i].label; }
    }
    return '';
  }

  function regionLabel(trip) {
    return trip.destination === 'domestic' ? '국내' : labelOf('country', trip.country);
  }

  function tripTitle(trip) {
    return '[PackCheck] ' + regionLabel(trip) + ' ' + labelOf('nights', trip.nights) + ' ' + labelOf('purpose', trip.purpose) + ' 준비물';
  }

  /* ============================================================
     저장 / 복원
     ============================================================ */
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        step: state.step,
        trip: state.trip,
        items: state.items,
        suggestions: state.suggestions,
        sent: state.sent
      }));
    } catch (e) {
      // 저장 실패(시크릿 모드 등)는 무시합니다.
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { return null; }
      var data = JSON.parse(raw);
      if (!data || !data.trip || !data.items) { return null; }
      return data;
    } catch (e) {
      return null;
    }
  }

  function clearSaved() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 무시 */ }
  }

  /* ============================================================
     공유 링크 (쿼리스트링)
     ============================================================ */
  function isValidCode(kind, code) {
    var list = CHOICES[kind];
    for (var i = 0; i < list.length; i++) {
      if (list[i].code === code) { return true; }
    }
    return false;
  }

  function tripToQuery(trip) {
    var q = 'd=' + trip.destination
      + (trip.destination === 'overseas' ? '&c=' + trip.country : '')
      + '&m=' + trip.month
      + '&n=' + trip.nights
      + '&p=' + trip.purpose
      + '&h=' + trip.headcount;
    return q;
  }

  function shareUrl(trip) {
    // 배포 후에는 실제 주소가 자동으로 들어갑니다.
    // 파일을 직접 열었을 때(file://)는 주소를 알 수 없으므로 자리표시자를 씁니다.
    var base = location.protocol === 'file:'
      ? 'https://(배포주소)/'
      : location.origin + location.pathname;
    return base + '?' + tripToQuery(trip);
  }

  function tripFromQuery() {
    if (!location.search) { return null; }
    var params = new URLSearchParams(location.search);
    var d = params.get('d');
    var c = params.get('c');
    var m = parseInt(params.get('m'), 10);
    var n = parseInt(params.get('n'), 10);
    var p = params.get('p');
    var h = parseInt(params.get('h'), 10);

    if (!isValidCode('destination', d)) { return null; }
    if (!isValidCode('purpose', p)) { return null; }
    if (!isValidCode('nights', n)) { return null; }
    if (!isValidCode('headcount', h)) { return null; }
    if (!(m >= 1 && m <= 12)) { return null; }
    if (d === 'overseas' && !isValidCode('country', c)) { return null; }

    return {
      destination: d,
      country: d === 'overseas' ? c : null,
      month: m,
      nights: n,
      purpose: p,
      headcount: h
    };
  }

  /* ============================================================
     화면 그리기
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };

  function esc(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var X_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
    + '<path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';

  // STEP 1 버튼 그룹 만들기
  function renderOptions(containerId, kind) {
    var box = $(containerId);
    var list = CHOICES[kind];
    var html = '';
    for (var i = 0; i < list.length; i++) {
      html += '<button type="button" class="opt" aria-pressed="false" data-kind="' + kind + '" data-code="' + esc(list[i].code) + '">'
        + esc(list[i].label) + '</button>';
    }
    box.innerHTML = html;
  }

  function renderMonthSelect() {
    var sel = $('f-month');
    var html = '';
    for (var m = 1; m <= 12; m++) {
      html += '<option value="' + m + '"' + (m === draft.month ? ' selected' : '') + '>' + m + '월</option>';
    }
    sel.innerHTML = html;
  }

  function syncStep1() {
    var buttons = document.querySelectorAll('#step1 .opt');
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      var kind = btn.getAttribute('data-kind');
      var code = btn.getAttribute('data-code');
      var value = (kind === 'nights' || kind === 'headcount') ? String(draft[kind]) : draft[kind];
      btn.setAttribute('aria-pressed', value === code ? 'true' : 'false');
    }
    $('field-country').classList.toggle('hidden', draft.destination !== 'overseas');
  }

  function renderProgress() {
    var total = state.items.length;
    var done = 0;
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].checked) { done++; }
    }
    var ratio = total ? Math.round((done / total) * 100) : 0;
    $('progFill').style.width = ratio + '%';
    $('progText').textContent = total + '개 중 ' + done + '개 완료';
  }

  function renderEssentials() {
    var box = $('essentials');
    if (!state.items.length) {
      box.innerHTML = '<div class="empty">항목이 모두 삭제되었습니다.</div>';
      return;
    }
    var html = '';
    for (var c = 0; c < CATEGORY_ORDER.length; c++) {
      var category = CATEGORY_ORDER[c];
      var rows = '';
      for (var i = 0; i < state.items.length; i++) {
        var item = state.items[i];
        if (item.category !== category) { continue; }
        rows += '<div class="item' + (item.checked ? ' done' : '') + '">'
          + '<label class="item-main">'
          + '<input type="checkbox" data-act="check" data-id="' + esc(item.id) + '"' + (item.checked ? ' checked' : '') + '>'
          + '<span class="item-name">' + esc(item.name) + '</span>'
          + (item.qty > 0 ? '<span class="item-qty">' + item.qty + '개</span>' : '')
          + '</label>'
          + '<button type="button" class="item-x" data-act="remove" data-id="' + esc(item.id) + '" aria-label="' + esc(item.name) + ' 삭제">'
          + X_ICON + '</button>'
          + '</div>';
      }
      if (rows) {
        html += '<div class="cat"><div class="cat-name">' + esc(category) + '</div><div class="cat-box">' + rows + '</div></div>';
      }
    }
    box.innerHTML = html;
  }

  function renderSuggestions() {
    var box = $('suggestions');
    if (!state.suggestions.length) {
      box.innerHTML = '<div class="empty">추천할 항목을 모두 확인했습니다.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < state.suggestions.length; i++) {
      var s = state.suggestions[i];
      html += '<div class="sug">'
        + '<div class="sug-name">' + esc(s.name) + '</div>'
        + '<div class="sug-reason">' + esc(s.reason) + '</div>'
        + '<div class="sug-actions">'
        + '<button type="button" class="outline" data-act="add" data-id="' + esc(s.id) + '">추가</button>'
        + '<button type="button" class="textbtn" data-act="reject" data-id="' + esc(s.id) + '">필요 없어요</button>'
        + '</div></div>';
    }
    box.innerHTML = html;
  }

  function renderStep2() {
    $('tripSummary').textContent = regionLabel(state.trip) + ' / ' + state.trip.month + '월 / '
      + labelOf('nights', state.trip.nights) + ' / ' + labelOf('purpose', state.trip.purpose) + ' / '
      + labelOf('headcount', state.trip.headcount);
    renderProgress();
    renderEssentials();
    renderSuggestions();
  }

  function render() {
    var onStep2 = state.step === 2 && state.trip;
    $('step1').classList.toggle('hidden', onStep2);
    $('step2').classList.toggle('hidden', !onStep2);
    $('bottomBar').classList.toggle('hidden', !onStep2);
    $('resetBtn').classList.toggle('hidden', !onStep2);
    if (onStep2) {
      renderStep2();
    } else {
      syncStep1();
    }
  }

  /* ============================================================
     토스트
     ============================================================ */
  var toastTimer = null;
  function showToast(message) {
    var el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  /* ============================================================
     동작
     ============================================================ */
  function startList(trip, fromShare) {
    var built = buildList(trip);
    state.step = 2;
    state.trip = trip;
    state.items = built.items;
    state.suggestions = built.suggestions;
    state.sent = {};
    save();
    render();
    window.scrollTo(0, 0);
    if (!fromShare) {
      track('list_generated', {
        destination: trip.destination,
        country: trip.destination === 'overseas' ? trip.country : 'none',
        month: trip.month,
        nights: trip.nights,
        purpose: trip.purpose,
        headcount: trip.headcount,
        suggestion_count: built.suggestions.length
      });
    }
  }

  function findIndexById(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { return i; }
    }
    return -1;
  }

  function addSuggestion(id) {
    var index = findIndexById(state.suggestions, id);
    if (index < 0) { return; }
    var s = state.suggestions[index];
    state.suggestions.splice(index, 1);
    state.items.push({ id: s.id, name: s.name, category: s.category, qty: s.qty, checked: false });
    trackOnce('suggestion_added', s.id, { item_name: s.name, item_category: s.category });
    save();
    render();
  }

  function rejectSuggestion(id) {
    var index = findIndexById(state.suggestions, id);
    if (index < 0) { return; }
    var s = state.suggestions[index];
    state.suggestions.splice(index, 1);
    trackOnce('suggestion_rejected', s.id, { item_name: s.name, item_category: s.category });
    save();
    render();
  }

  function removeItem(id) {
    var index = findIndexById(state.items, id);
    if (index < 0) { return; }
    var item = state.items[index];
    state.items.splice(index, 1);
    trackOnce('essential_removed', item.id, { item_name: item.name, item_category: item.category });
    save();
    render();
  }

  function toggleCheck(id, checked) {
    var index = findIndexById(state.items, id);
    if (index < 0) { return; }
    var item = state.items[index];
    item.checked = checked;
    if (checked) {
      trackOnce('item_checked', item.id, { item_name: item.name });
    }
    save();
    render();
  }

  function buildShareText() {
    var lines = [tripTitle(state.trip), ''];
    for (var c = 0; c < CATEGORY_ORDER.length; c++) {
      var category = CATEGORY_ORDER[c];
      var rows = [];
      for (var i = 0; i < state.items.length; i++) {
        var item = state.items[i];
        if (item.category !== category) { continue; }
        rows.push('- ' + item.name + (item.qty > 0 ? ' ' + item.qty + '개' : ''));
      }
      if (rows.length) {
        lines.push(category);
        lines = lines.concat(rows);
        lines.push('');
      }
    }
    lines.push('내 여행 준비물도 만들기: ' + shareUrl(state.trip));
    return lines.join('\n');
  }

  // 예전 브라우저와 카카오톡 인앱 브라우저용 복사 방식입니다.
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    // 최신 브라우저는 clipboard API 를 쓰고, 막히면 예전 방식으로 한 번 더 시도합니다.
    return new Promise(function (resolve, reject) {
      function fallback() {
        if (legacyCopy(text)) { resolve(); } else { reject(new Error('copy failed')); }
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(resolve, fallback);
      } else {
        fallback();
      }
    });
  }

  function shareList() {
    var checked = 0;
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].checked) { checked++; }
    }
    track('list_shared', { total_items: state.items.length, checked_items: checked });

    copyText(buildShareText()).then(function () {
      showToast('복사되었습니다');
    }).catch(function () {
      showToast('복사에 실패했습니다. 텍스트를 직접 선택해 주세요');
    });
  }

  function resetAll() {
    clearSaved();
    state.step = 1;
    state.trip = null;
    state.items = [];
    state.suggestions = [];
    state.sent = {};
    draft.destination = null;
    draft.country = null;
    draft.month = new Date().getMonth() + 1;
    draft.nights = null;
    draft.purpose = null;
    draft.headcount = null;
    if (location.search) {
      history.replaceState(null, '', location.pathname);
    }
    $('f-month').value = String(draft.month);
    render();
    window.scrollTo(0, 0);
  }

  /* ============================================================
     이벤트 연결
     ============================================================ */
  $('step1').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.opt') : null;
    if (!btn) { return; }
    var kind = btn.getAttribute('data-kind');
    var code = btn.getAttribute('data-code');
    draft[kind] = (kind === 'nights' || kind === 'headcount') ? parseInt(code, 10) : code;
    if (kind === 'destination' && code === 'domestic') { draft.country = null; }
    syncStep1();
  });

  $('f-month').addEventListener('change', function (e) {
    draft.month = parseInt(e.target.value, 10);
  });

  $('makeBtn').addEventListener('click', function () {
    if (!draft.destination) { showToast('목적지를 골라 주세요'); return; }
    if (draft.destination === 'overseas' && !draft.country) { showToast('국가를 골라 주세요'); return; }
    if (draft.nights === null) { showToast('기간을 골라 주세요'); return; }
    if (!draft.purpose) { showToast('여행 성격을 골라 주세요'); return; }
    if (draft.headcount === null) { showToast('인원을 골라 주세요'); return; }
    startList({
      destination: draft.destination,
      country: draft.destination === 'overseas' ? draft.country : null,
      month: draft.month,
      nights: draft.nights,
      purpose: draft.purpose,
      headcount: draft.headcount
    }, false);
  });

  $('essentials').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act="remove"]') : null;
    if (btn) { removeItem(btn.getAttribute('data-id')); }
  });

  $('essentials').addEventListener('change', function (e) {
    var input = e.target;
    if (input && input.getAttribute('data-act') === 'check') {
      toggleCheck(input.getAttribute('data-id'), input.checked);
    }
  });

  $('suggestions').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) { return; }
    var act = btn.getAttribute('data-act');
    if (act === 'add') { addSuggestion(btn.getAttribute('data-id')); }
    if (act === 'reject') { rejectSuggestion(btn.getAttribute('data-id')); }
  });

  $('shareBtn').addEventListener('click', shareList);
  $('resetBtn').addEventListener('click', resetAll);

  /* ============================================================
     시작
     ============================================================ */
  function init() {
    renderOptions('f-destination', 'destination');
    renderOptions('f-country', 'country');
    renderOptions('f-nights', 'nights');
    renderOptions('f-purpose', 'purpose');
    renderOptions('f-headcount', 'headcount');
    renderMonthSelect();

    var sharedTrip = tripFromQuery();
    if (sharedTrip) {
      // 공유 링크로 들어온 경우: STEP 1 을 건너뛰고 같은 조건의 리스트를 바로 보여 줍니다.
      track('shared_link_opened', {
        country: sharedTrip.destination === 'overseas' ? sharedTrip.country : 'none',
        purpose: sharedTrip.purpose
      });
      startList(sharedTrip, true);
      return;
    }

    var saved = load();
    if (saved) {
      state.step = saved.step || 2;
      state.trip = saved.trip;
      state.items = saved.items;
      state.suggestions = saved.suggestions || [];
      state.sent = saved.sent || {};
      draft.destination = saved.trip.destination;
      draft.country = saved.trip.country;
      draft.month = saved.trip.month;
      draft.nights = saved.trip.nights;
      draft.purpose = saved.trip.purpose;
      draft.headcount = saved.trip.headcount;
      $('f-month').value = String(draft.month);
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
