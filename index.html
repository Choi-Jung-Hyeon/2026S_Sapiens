<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PackCheck - 여행 준비물 체크리스트</title>
<meta name="description" content="여행 조건을 고르면 준비물 체크리스트를 만들어 줍니다.">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="head">
    <div class="logo">PackCheck</div>
    <button type="button" id="resetBtn" class="reset-btn hidden">처음부터 다시</button>
  </div>

  <!-- STEP 1 : 여행 정보 입력 -->
  <section id="step1">
    <p class="lead">여행 조건을 고르면 준비물 체크리스트를 만들어 드립니다.</p>

    <div class="field">
      <div class="field-label">목적지</div>
      <div class="opts" id="f-destination"></div>
    </div>

    <div class="field hidden" id="field-country">
      <div class="field-label">국가</div>
      <div class="opts" id="f-country"></div>
    </div>

    <div class="field">
      <div class="field-label">출발 월</div>
      <select id="f-month"></select>
    </div>

    <div class="field">
      <div class="field-label">기간</div>
      <div class="opts" id="f-nights"></div>
    </div>

    <div class="field">
      <div class="field-label">여행 성격</div>
      <div class="opts" id="f-purpose"></div>
    </div>

    <div class="field">
      <div class="field-label">인원</div>
      <div class="opts" id="f-headcount"></div>
    </div>

    <button type="button" id="makeBtn" class="primary">준비물 리스트 만들기</button>
  </section>

  <!-- STEP 2 : 체크리스트 -->
  <section id="step2" class="hidden">
    <p class="lead" id="tripSummary"></p>

    <div class="prog">
      <div class="prog-track"><i class="prog-fill" id="progFill"></i></div>
      <div class="prog-text" id="progText"></div>
    </div>

    <h2 class="sec-title">필수 준비물</h2>
    <div id="essentials"></div>

    <!-- 규칙 테이블에 없는 개인 준비물을 직접 넣는 칸입니다. -->
    <div class="add-row">
      <input type="text" id="customInput" class="add-input" maxlength="40" autocomplete="off"
             placeholder="직접 챙길 것 입력 (예: 렌즈 세척액)" aria-label="직접 챙길 것 입력">
      <button type="button" id="customAddBtn" class="outline add-btn">추가</button>
    </div>

    <h2 class="sec-title">이런 것도 필요하지 않으세요?</h2>
    <p class="sec-desc">입력한 조건에 맞춰 골라 봤습니다.</p>
    <div id="suggestions"></div>
  </section>
</div>

<div class="bottom hidden" id="bottomBar">
  <div class="bottom-inner">
    <!-- 수요 확인용 버튼입니다. 실제 알림 기능은 아직 없습니다. -->
    <button type="button" id="notifyBtn" class="outline notify-btn">출발 1시간 전 알림 받기</button>
    <button type="button" id="shareBtn" class="primary">체크리스트 공유하기</button>
    <!-- 관찰 테스트용. 테스터가 다 쓰고 눌러서 기록을 보내 줍니다. -->
    <button type="button" id="testLogBtn" class="logbtn">테스트 기록 복사</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" class="toast-undo hidden">실행 취소</button>
</div>

<!-- 준비물 규칙 테이블. 준비물을 바꾸려면 rules.js 만 고치면 됩니다. -->
<script src="rules.js"></script>

<!-- 화면 동작. rules.js 보다 반드시 뒤에 와야 합니다. -->
<script src="app.js"></script>
</body>
</html>
